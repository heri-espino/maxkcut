<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-label="Experiment027 | angular-guided search protocol"><rect x="0" y="0" width="1200" height="700" rx="0" fill="#FFFFFF" stroke="none" stroke-width="0"/><rect x="0" y="0" width="1200" height="9" rx="0" fill="#0B6E92" stroke="none" stroke-width="0"/><text x="60" y="69" fill="#103453" font-size="31" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="start" >Experiment027 | angular-guided search protocol</text><text x="60" y="101" fill="#667F91" font-size="18" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="start" >Three proposal rules · same signed-cut verifier · same downstream refinement</text><line x1="60" y1="115" x2="1140" y2="115" stroke="#D8E5EF" stroke-width="1" /><rect x="64" y="212" width="195" height="114" rx="13" fill="#E7F3F8" stroke="#9CCDDD" stroke-width="2"/><text x="161.5" y="253" fill="#104A6A" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle" >Shared GW normal</text><text x="161.5" y="283" fill="#50788A" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="middle" >Same saved EVA factor</text><line x1="259" y1="268" x2="292" y2="268" stroke="#0F7495" stroke-width="3" /><path d="M284 260 L292 268 L284 276" stroke="#0F7495" stroke-width="3" fill="none"/><rect x="300" y="212" width="206" height="114" rx="13" fill="#E7F3F8" stroke="#9CCDDD" stroke-width="2"/><text x="403" y="253" fill="#104A6A" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle" >Angular target</text><text x="403" y="283" fill="#50788A" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="middle" >Margin / gain / pair</text><line x1="506" y1="268" x2="538" y2="268" stroke="#0F7495" stroke-width="3" /><path d="M530 260 L538 268 L530 276" stroke="#0F7495" stroke-width="3" fill="none"/><rect x="546" y="212" width="206" height="114" rx="13" fill="#E7F3F8" stroke="#9CCDDD" stroke-width="2"/><text x="649" y="253" fill="#104A6A" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle" >Exact arc sweeps</text><text x="649" y="283" fill="#50788A" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="middle" >Up to 8 per round</text><line x1="752" y1="268" x2="784" y2="268" stroke="#0F7495" stroke-width="3" /><path d="M776 260 L784 268 L776 276" stroke="#0F7495" stroke-width="3" fill="none"/><rect x="792" y="212" width="158" height="114" rx="13" fill="#E7F3F8" stroke="#9CCDDD" stroke-width="2"/><text x="871" y="253" fill="#104A6A" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle" >Select gain</text><text x="871" y="283" fill="#50788A" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="middle" >Strictly better cut</text><line x1="950" y1="268" x2="979" y2="268" stroke="#0F7495" stroke-width="3" /><path d="M971 260 L979 268 L971 276" stroke="#0F7495" stroke-width="3" fill="none"/><rect x="987" y="212" width="164" height="114" rx="13" fill="#E7F3F8" stroke="#9CCDDD" stroke-width="2"/><text x="1069" y="253" fill="#104A6A" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="700" text-anchor="middle" >Flip → KL → ILS</text><text x="1069" y="283" fill="#50788A" font-size="15" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="middle" >Common refiner</text><text x="65" y="408" fill="#1D425B" font-size="22" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" text-anchor="start" >Only strict improvements update the hyperplane; otherwise the angular search stops.</text><text x="65" y="451" fill="#46677C" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="start" >Every attempted semicircle is evaluated on the original signed cut objective.</text><text x="65" y="494" fill="#46677C" font-size="19" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="start" >32 outer rounds × ≤8 candidate semicircle sweeps · 16 matched GW starts per graph/method.</text><rect x="62" y="537" width="1076" height="75" rx="12" fill="#F2F7FA" stroke="none" stroke-width="0"/><text x="82" y="582" fill="#16647D" font-size="20" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="600" text-anchor="start" >No new SDP/EVA solve · Original Experiment025 factor hashes and 16 GW normals reused.</text><line x1="60" y1="656" x2="1140" y2="656" stroke="#D8E5EF" stroke-width="1" /><text x="62" y="680" fill="#6C8193" font-size="13" font-family="Inter,Segoe UI,Arial,sans-serif" font-weight="400" text-anchor="start" >SOURCE: Experiment027 published 71-graph audit · 8 Nov 2026</text></svg>
