[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "maxkcut"
version = "0.1.0"
description = "Reproducible semidefinite Max-k-Cut rounding experiments"
readme = "README.md"
requires-python = ">=3.11"
keywords = ["max-k-cut", "semidefinite-programming", "rounding", "clustering", "graphs"]
dependencies = ["numpy>=1.26", "scipy>=1.11", "cvxpy>=1.5", "threadpoolctl>=3.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
docs = ["sphinx>=8,<10", "furo>=2024.8", "myst-parser>=4", "sphinx-copybutton>=0.5"]
dev = ["pytest>=8", "sphinx>=8,<10", "furo>=2024.8", "myst-parser>=4", "sphinx-copybutton>=0.5"]
gpu = ["torch>=2.10"]
eva-fast = ["numba>=0.67,<0.69"]

[project.scripts]
maxkcut = "maxkcut.cli:main"
maxkcut-sweep = "maxkcut.sweep_cli:main"
maxkcut-gpu = "maxkcut.lowrank_cli:main"
maxkcut-sdp-compare = "maxkcut.study_cli:main"
maxkcut-sdp-batch = "maxkcut.sdp_batch_cli:main"
maxkcut-sdp-publish = "maxkcut.sdp_publish_cli:main"
maxkcut-eva = "maxkcut.eva_cli:main"
maxkcut-eva-benchmark = "maxkcut.eva_benchmark_cli:main"
maxkcut-eva-round = "maxkcut.eva_rounding_cli:main"
maxkcut-eva-mst = "maxkcut.eva_mst_cli:main"
maxkcut-eva-mst-center = "maxkcut.eva_mst_center_cli:main"
maxkcut-eva-mst-multicut = "maxkcut.eva_mst_multicut_cli:main"
maxkcut-eva-escape = "maxkcut.eva_escape_cli:main"
maxkcut-eva-elite = "maxkcut.eva_elite_cli:main"
maxkcut-eva-cutaware = "maxkcut.eva_cutaware_kmeans_cli:main"
maxkcut-eva-grid = "maxkcut.eva_pipeline_grid_cli:main"
maxkcut-eva-direct-rounding = "maxkcut.eva_direct_rounding_cli:main"
maxkcut-eva-soft-em = "maxkcut.eva_soft_em_bernoulli_cli:main"
maxkcut-eva-multigroup = "maxkcut.eva_multigroup_kmeans_cli:main"
maxkcut-eva-kmeans-inits = "maxkcut.eva_kmeans_init_cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["maxkcut*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
