<text x="700" y="131" font-family="sans-serif" font-size="11" fill="#1b3141">Y/−H: 0.0055%</text>
<text x="30" y="188" font-family="sans-serif" font-size="15" font-weight="700" fill="#1b3141">G6</text>
<rect x="150" y="170" width="387.4" height="24" rx="3" fill="#d48c3a"/>
