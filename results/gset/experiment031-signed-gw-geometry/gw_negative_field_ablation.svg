<text x="410.0" y="401" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#64788a">10%</text>
<line x1="540.0" y1="88" x2="540.0" y2="383" stroke="#e0e5eb"/>
<text x="540.0" y="401" font-size="11" font-family="sans-serif" text-anchor="middle" fill="#64788a">15%</text>
