name: Experiment029 - 100 EVA seeds, antipodal K-MeansNM only

# A narrowly scoped one-shot trigger. Source, notes and results commits do not
# rerun expensive EVA. Once complete, retain only workflow_dispatch.
on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: experiment029-kmeansnm-100seed
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment029-eva-kmeansnm-100seed'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only hosted test dependencies
        run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.67,<0.69' threadpoolctl pytest
      - name: Test historical factor reuse and new-case archiving on synthetic data
        env:
          PYTHONPATH: src
          NUMBA_NUM_THREADS: '1'
          OPENBLAS_NUM_THREADS: '1'
        run: python -m pytest tests/test_experiment029_kmeansnm_100seeds.py -q
      - name: Validate all five original G-set input graph hashes before computing
        env:
          PYTHONPATH: src
        run: python scripts/experiment029_kmeansnm_100seeds.py --validate-only

  compute:
    needs: validate
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment029-eva-kmeansnm-100seed'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - name: Verify dedicated PCAG103A-13 and isolated Actions workspace
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-13') { throw 'Wrong university runner' }
          if ($env:GITHUB_WORKSPACE -eq 'C:\Users\175199\maxkcut') { throw 'Refusing to touch active Experiment025 worktree' }
          Write-Host "Using $env:RUNNER_NAME / $env:GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: experiment029-eva-kmeansnm-100seed
          lfs: true
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm existing Experiment028 binary factors are real LFS contents
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $base='results/gset/experiment028-eva-fullrank-pilot/runs'
          foreach ($g in @('G1','G6','G11','G14','G18')) {
            foreach ($mode in @('default','full')) {
              foreach ($seed in 2026..2030) {
                $f=Join-Path $base "$g/$mode/seed-$seed/factor.npz"
                if (-not (Test-Path $f)) { throw "Missing frozen EVA factor $f" }
                if ((Get-Item $f).Length -lt 1024) { throw "LFS binary unresolved: $f" }
              }
            }
          }
          Write-Host '50 original factor checkpoint files are present and non-pointer sized.'
      - name: Locate existing Conda environment without installing packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prefix=$null
          if ($env:MAXKCUT_CONDA_PREFIX -and (Split-Path $env:MAXKCUT_CONDA_PREFIX -Leaf) -ieq 'maxkcut') {
            $prefix=$env:MAXKCUT_CONDA_PREFIX
          }
          if (-not $prefix -and $env:CONDA_PREFIX -and (Split-Path $env:CONDA_PREFIX -Leaf) -ieq 'maxkcut') {
            $prefix=$env:CONDA_PREFIX
          }
          if (-not $prefix -and (Get-Command conda -ErrorAction SilentlyContinue)) {
            $json=(& conda env list --json | Out-String | ConvertFrom-Json)
            foreach ($e in @($json.envs)) {
              if ((Split-Path $e -Leaf) -ieq 'maxkcut' -and (Test-Path (Join-Path $e 'python.exe'))) {
                $prefix=$e; break
              }
            }
          }
          if (-not $prefix) {
            foreach ($candidate in @("$env:LOCALAPPDATA\miniconda3\envs\maxkcut", "$env:USERPROFILE\miniconda3\envs\maxkcut", 'C:\ProgramData\miniconda3\envs\maxkcut')) {
              if (Test-Path (Join-Path $candidate 'python.exe')) { $prefix=$candidate; break }
            }
          }
          if (-not $prefix -or -not (Test-Path (Join-Path $prefix 'python.exe'))) { throw 'maxkcut Conda interpreter unavailable' }
          Add-Content $env:GITHUB_ENV "EX029_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "EX029_PYTHON=$(Join-Path $prefix 'python.exe')"
          Write-Host 'Existing maxkcut Conda interpreter available.'
      - name: Compute 95 new EVA seeds per rank and graph; cluster only with K-MeansNM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH=Join-Path (Get-Location).Path 'src'
          $env:CONDA_PREFIX=$env:EX029_PREFIX
          $env:CONDA_DEFAULT_ENV='maxkcut'
          foreach ($part in @('Library\mingw-w64\bin','Library\usr\bin','Library\bin','Scripts','')) {
            $p=Join-Path $env:EX029_PREFIX $part
            if (Test-Path $p) { $env:PATH="$p;$env:PATH" }
          }
          $env:NUMBA_NUM_THREADS='1'
          $env:OPENBLAS_NUM_THREADS='1'
          $env:MKL_NUM_THREADS='1'
          $env:OMP_NUM_THREADS='1'
          & $env:EX029_PYTHON -u scripts/experiment029_kmeansnm_100seeds.py --workers 5 --max-sweeps 1000 --tolerance 0.001 --checkpoint-every 25
          if ($LASTEXITCODE -ne 0) { throw "Experiment029 EVA failed: $LASTEXITCODE" }
          & $env:EX029_PYTHON -u scripts/experiment029_kmeansnm_100seeds.py --check-only
          if ($LASTEXITCODE -ne 0) { throw '1000-cut original signed audit failed' }

      # Each graph is separate, staying below the per-artifact size limit.
      - name: Archive G1 independent checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment029-G1-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G1/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive G6 independent checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment029-G6-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G6/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive G11 independent checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment029-G11-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G11/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive G14 independent checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment029-G14-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G14/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive G18 independent checkpoints
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment029-G18-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G18/
          retention-days: 90
          if-no-files-found: warn
      - name: Archive compact results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: experiment029-compact-results
          path: |
            results/gset/experiment029-eva-kmeansnm-100seed/all_runs.csv
            results/gset/experiment029-eva-kmeansnm-100seed/paired_differences.csv
            results/gset/experiment029-eva-kmeansnm-100seed/per_graph.csv
            results/gset/experiment029-eva-kmeansnm-100seed/summary.json
            results/gset/experiment029-eva-kmeansnm-100seed/report.md
          retention-days: 90
          if-no-files-found: error

  archive:
    needs: compute
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment029-eva-kmeansnm-100seed'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment029-eva-kmeansnm-100seed
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight packages for independent original signed-cut verification
        run: python -m pip install 'numpy>=1.26,<3'
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-compact-results
          path: results/gset/experiment029-eva-kmeansnm-100seed
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G1-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G1
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G6-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G6
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G11-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G11
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G14-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G14
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G18-checkpoints
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G18
      - name: Audit all 950 new checkpoints independently without running EVA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv,hashlib,json
          import numpy as np
          root=Path('results/gset/experiment029-eva-kmeansnm-100seed')
          summ=json.loads((root/'summary.json').read_text())
          assert summ['complete'] and summ['rows_observed']==1000 and summ['paired_observed']==500
          assert summ['new_factor_cases']==950 and summ['reused_prior_factor_cases']==50
          bygraph={}
          for g in ('G1','G6','G11','G14','G18'):
              rows=[]
              with (Path('data')/f'{g}.txt').open() as fh:
                  n,m=map(int,fh.readline().split())
                  assert n==800
                  for line in fh:
                      a,b,w=line.split()
                      rows.append((int(a)-1,int(b)-1,float(w)))
              assert len(rows)==m
              bygraph[g]=(np.array([a for a,b,w in rows]),np.array([b for a,b,w in rows]),
                          np.array([w for a,b,w in rows]))
          def sha(path):
              dig=hashlib.sha256()
              with path.open('rb') as f:
                  for part in iter(lambda:f.read(1<<20),b''):dig.update(part)
              return dig.hexdigest()
          total=0
          for case in sorted((root/'runs').glob('*/**/case.json')):
              d=json.loads(case.read_text()); row=d['row']
              graph,seed,mode=d['graph'],int(d['seed']),d['rank_mode']
              assert graph in bygraph and 2031<=seed<=2125 and mode in ('default','full')
              fa,pa=case.parent/'factor.npz',case.parent/'partitions.npz'
              assert sha(fa)==row['factor_sha256']
              assert sha(pa)==d['partitions_archive_sha256']
              with np.load(pa,allow_pickle=False) as archived:
                  assert set(archived.files)=={'K-MeansNM_EVA'}
                  packed=archived['K-MeansNM_EVA']
              assert hashlib.sha256(packed.tobytes()).hexdigest()==row['partition_sha256']
              bits=np.unpackbits(packed)[:800]
              a,b,w=bygraph[graph]
              score=float(w[bits[a]!=bits[b]].sum())
              assert abs(score-float(row['cut_weight']))<1e-9,(case,score,row['cut_weight'])
              assert row['graph']==graph and int(row['seed'])==seed and row['rank_mode']==mode
              total+=1
          assert total==950,total
          with (root/'all_runs.csv').open(newline='') as f:
              allrows=list(csv.DictReader(f))
          assert len(allrows)==1000
          assert len({(r['graph'],r['seed'],r['rank_mode']) for r in allrows})==1000
          with (root/'paired_differences.csv').open(newline='') as f:
              paired=list(csv.DictReader(f))
          assert len(paired)==500
          print(f'PASS: {total} verified new factor and signed-cut archives, plus 50 reused historical cases')
          PY
      - name: Normalize only text files before Git publication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in Path('results/gset/experiment029-eva-kmeansnm-100seed').rglob('*'):
              if file.is_file() and file.suffix in ('.csv','.json','.jsonl','.md'):
                  data=file.read_bytes();lf=data.replace(b'\r\n',b'\n')
                  if data!=lf:file.write_bytes(lf)
          PY
      - name: Publish audited compact analysis first
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          d='results/gset/experiment029-eva-kmeansnm-100seed'
          git add -- "$d/all_runs.csv" "$d/paired_differences.csv" "$d/per_graph.csv" "$d/summary.json" "$d/report.md"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'Compact reports already committed; no changes made'
          else
            git commit -m 'experiment029: publish audited 1000-cut paired K-MeansNM comparison'
            git push origin HEAD:experiment029-eva-kmeansnm-100seed
          fi
      - name: Commit verified checkpoints and sweep histories to Git LFS per graph
        shell: bash
        run: |
          set -euo pipefail
          git lfs install --local
          for g in G1 G6 G11 G14 G18; do
            dir="results/gset/experiment029-eva-kmeansnm-100seed/runs/$g"
            git add -- "$dir"
            git diff --cached --check
            tracked="$(git ls-files -- "$dir" | grep -cE '\.npz$' || true)"
            test "$tracked" -eq 380 || { echo "Expected 380 staged binary FILE PATHS for $g, got $tracked"; exit 1; }
            while IFS= read -r file; do
              attr="$(git check-attr filter -- "$file")"
              [[ "$attr" == *": filter: lfs" ]] || { echo "Expected LFS: $file"; exit 1; }
            done < <(git ls-files -- "$dir" | grep -E '\.npz$')
            echo "$g: 380 tracked binary paths, duplicate LFS object hashes allowed."
            if git diff --cached --quiet; then
              echo "$g archive already committed"
            else
              git commit -m "experiment029: archive $g 95 EVA factors, partitions and sweep traces"
              git push origin HEAD:experiment029-eva-kmeansnm-100seed
            fi
            echo "Archived all $g EVA artifacts with verified Git LFS storage"
          done
          echo 'PASS: all 1900 Git LFS binary archives published; no existing source modified'