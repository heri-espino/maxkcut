name: Build full Marp research presentation (Experiments 001–025 plus 028–029)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - presentation/experiment025-structure-results
    paths:
      - "documents/presentations/**"
      - "results/gset/experiment025-gw16-bestcut-quality/analysis/**"
      - "results/gset/experiment022-graph-structure-methods/graph_features.csv"
      - "results/gset/experiment029-eva-kmeansnm-100seed/per_graph.csv"
      - ".github/workflows/experiment025-marp-presentation.yml"
  pull_request:
    paths:
      - "documents/presentations/**"
      - "results/gset/experiment025-gw16-bestcut-quality/analysis/**"
      - "results/gset/experiment022-graph-structure-methods/graph_features.csv"
      - "results/gset/experiment029-eva-kmeansnm-100seed/per_graph.csv"
      - ".github/workflows/experiment025-marp-presentation.yml"

permissions:
  contents: read

concurrency:
  group: experiment025-marp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  figures-and-deck:
    # Hosted runner only; NO university Windows VM, EVA, SDP, or optimization.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Regenerate all historical and Experiment025 SVG figures
        run: |
          python -m pip install --disable-pip-version-check "numpy>=1.26,<3" "matplotlib>=3.8,<4" "pypdf>=5,<7"
          python documents/presentations/build_assets.py
          python documents/presentations/build_full_research_figures.py
          MPLBACKEND=Agg python documents/presentations/make_extra_graphics.py
          node documents/presentations/build_experiment025_figures.mjs
          node documents/presentations/build_experiment025_figures.mjs --check
          node documents/presentations/build_experiment025_reference_ratio_figures.mjs
          node documents/presentations/build_experiment025_reference_ratio_figures.mjs --check
          node documents/presentations/build_experiment029_rank_figure.mjs
          node documents/presentations/build_experiment029_rank_figure.mjs --check

      - name: Verify committed Experiment025 figures are deterministic
        run: |
          git diff --exit-code -- documents/presentations/assets/experiment025_*.svg documents/presentations/assets/experiment029_*.svg documents/presentations/experiment025-figure-manifest.json documents/presentations/experiment025-reference-ratio-manifest.json documents/presentations/data/experiment025_best_of16_method_ratios.csv
          node documents/presentations/verify_experiment025_presentation.mjs

      - name: Install pinned Marp CLI
        run: npm install --no-save --no-package-lock @marp-team/marp-cli@4.5.1

      - name: Discover Chrome browser
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -n "$BROWSER" ]]; then
            echo "BROWSER_PATH=$BROWSER" >> "$GITHUB_ENV"
            echo "Marp browser: $BROWSER"
          else
            echo "No system Chrome found; Marp will try its browser auto-discovery."
          fi

      - name: Export Marp as PDF and HTML
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p documents/presentations/build
          source="documents/presentations/maxkcut_full_research_001_025.marp.md"
          root="documents/presentations/build/maxkcut_full_research_001_025"
          browser=()
          if [[ -n "${BROWSER_PATH:-}" ]]; then browser=(--browser-path "$BROWSER_PATH"); fi
          ./node_modules/.bin/marp "$source" --allow-local-files "${browser[@]}" --pdf -o "${root}.pdf"
          ./node_modules/.bin/marp "$source" --allow-local-files --html -o "${root}.html"

      - name: Embed SVG figures in standalone HTML
        run: node documents/presentations/embed_experiment025_html_assets.mjs

      - name: Validate PDF and self-contained HTML
        shell: bash
        run: |
          set -euo pipefail
          root="documents/presentations/build/maxkcut_full_research_001_025"
          for ext in pdf html; do test -s "${root}.${ext}"; done
          python - <<'PY'
          from pypdf import PdfReader
          name="documents/presentations/build/maxkcut_full_research_001_025.pdf"
          count=len(PdfReader(name).pages)
          if count!=104:
              raise SystemExit(f"Expected exactly 104 PDF pages; got {count}")
          print(f"Verified PDF pages: {count}")
          PY
          du -h "${root}.pdf" "${root}.html"

      - name: Upload PDF and standalone HTML
        uses: actions/upload-artifact@v4
        with:
          name: maxkcut-research-001-025-plus-029-marp
          path: |
            documents/presentations/build/maxkcut_full_research_001_025.pdf
            documents/presentations/build/maxkcut_full_research_001_025.html
          if-no-files-found: error
          retention-days: 30
