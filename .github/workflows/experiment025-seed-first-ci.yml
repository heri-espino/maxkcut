name: "Experiment025 seed-first CI"
on:
  push:
    branches: [experiment025-seed-first-actions]
    paths:
      - "src/maxkcut/experiment025_bestcut.py"
      - "scripts/experiment025-vm.ps1"
      - "scripts/experiment025-git-branch.ps1"
      - "scripts/experiment025-windows-preflight.ps1"
      - "tests/test_experiment025_windows_shell.py"
      - "scripts/experiment025_actions_matrix.py"
      - "tests/test_experiment025_seed_first.py"
      - "tests/test_experiment025_seed_progress.py"
      - "src/maxkcut/experiment025_seed_progress.py"
      - ".github/workflows/experiment025-seed-round.yml"
      - ".github/workflows/experiment025-seed-shard.yml"
      - ".github/workflows/experiment025-seed-first-ci.yml"
  pull_request:
    paths:
      - "src/maxkcut/experiment025_bestcut.py"
      - "scripts/experiment025-vm.ps1"
      - "scripts/experiment025-git-branch.ps1"
      - "scripts/experiment025-windows-preflight.ps1"
      - "tests/test_experiment025_windows_shell.py"
      - "scripts/experiment025_actions_matrix.py"
      - "tests/test_experiment025_seed_first.py"
      - "tests/test_experiment025_seed_progress.py"
      - "src/maxkcut/experiment025_seed_progress.py"
      - ".github/workflows/experiment025-seed-round.yml"
      - ".github/workflows/experiment025-seed-shard.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install numerical library tests and YAML parser
        run: python -m pip install -e ".[test,eva-fast]" pyyaml
      - name: Run seed-first, previous best-ever, and runner integration tests
        run: |
          python -m compileall -q src/maxkcut scripts/experiment025_actions_matrix.py
          python -m pytest tests/test_experiment025_windows_shell.py tests/test_experiment025_seed_first.py tests/test_experiment025_seed_progress.py tests/test_experiment025_bestcut.py tests/test_experiment025_actions_matrix.py tests/test_experiment025_vm_preflight.py tests/test_experiment024_paired_gw16.py tests/test_experiment024_integration.py -q
      - name: Validate chained GitHub Actions YAML and matrix bounds
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          parent=yaml.safe_load(Path(".github/workflows/experiment025-seed-round.yml").read_text())
          shard=yaml.safe_load(Path(".github/workflows/experiment025-seed-shard.yml").read_text())
          for i in range(6):
              job=parent["jobs"][f"batch{i}"]
              assert job["uses"]=="./.github/workflows/experiment025-seed-shard.yml"
              assert job["with"]["batch"]==i
              if i:
                  assert f"batch{i-1}" in job["needs"]
          assert "report" in parent["jobs"]
          assert "batch5" in parent["jobs"]["report"]["needs"]
          assert "windows_preflight" in parent["jobs"]
          assert "windows_preflight" in parent["jobs"]["batch0"]["needs"]
          assert parent["jobs"]["windows_preflight"]["defaults"]["run"]["shell"]=="powershell"
          assert shard["jobs"]["execute"]["defaults"]["run"]["shell"]=="powershell"
          assert shard["jobs"]["execute"]["strategy"]["max-parallel"]==1
          assert shard["jobs"]["execute"]["runs-on"]==["self-hosted","Windows","X64"]
          print("Validated 6 chained seed-round batches and correct runner")
          PY
      - name: Parse both Windows PowerShell scripts on hosted CI
        shell: pwsh
        run: |
          $tokens=$null
          $errors=$null
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/experiment025-vm.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          [System.Management.Automation.Language.Parser]::ParseFile("./scripts/experiment025-windows-preflight.ps1",[ref]$tokens,[ref]$errors) | Out-Null
          if($errors.Count -gt 0) { $errors | ForEach-Object { Write-Error $_ }; exit 1 }
          Write-Host "Both Experiment025 Windows PowerShell scripts parse successfully."

  detached_head_windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Reproduce GitHub detached HEAD under Windows PowerShell 5.1
        shell: powershell
        run: |
          . ./scripts/experiment025-git-branch.ps1
          git checkout --detach HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Could not create detached HEAD test state' }
          $branch = Get-Experiment025GitBranch
          if ($null -ne $branch -and $branch -ne '') { throw "Detached HEAD returned branch '$branch'" }
          git switch -c experiment025-detached-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Could not create test branch' }
          $branch = Get-Experiment025GitBranch
          if ($branch -ne 'experiment025-detached-smoke') { throw "Expected named branch, got '$branch'" }
          Write-Host 'PASS: Windows PowerShell 5.1 handles detached and named Git branches'
