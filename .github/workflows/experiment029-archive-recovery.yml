name: Experiment029 - recover verified factor archives (hosted only)
on:
  push:
    branches: [experiment029-eva-kmeansnm-100seed]
    paths: [".github/workflows/experiment029-archive-recovery.yml"]
permissions:
  contents: write
  actions: read
concurrency:
  group: experiment029-archive-recovery
  cancel-in-progress: false
jobs:
  archive:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment029-eva-kmeansnm-100seed'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment029-eva-kmeansnm-100seed
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight packages for independent original signed-cut verification
        run: python -m pip install 'numpy>=1.26,<3'
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-compact-results
          run-id: 43812691400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment029-eva-kmeansnm-100seed
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G1-checkpoints
          run-id: 43812691400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G1
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G6-checkpoints
          run-id: 43812691400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G6
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G11-checkpoints
          run-id: 43812691400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G11
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G14-checkpoints
          run-id: 43812691400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G14
      - uses: actions/download-artifact@v4
        with:
          name: experiment029-G18-checkpoints
          run-id: 43812691400
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment029-eva-kmeansnm-100seed/runs/G18
      - name: Audit all 950 new checkpoints independently without running EVA
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import csv,hashlib,json
          import numpy as np
          root=Path('results/gset/experiment029-eva-kmeansnm-100seed')
          summ=json.loads((root/'summary.json').read_text())
          assert summ['complete'] and summ['rows_observed']==1000 and summ['paired_observed']==500
          assert summ['new_factor_cases']==950 and summ['reused_prior_factor_cases']==50
          bygraph={}
          for g in ('G1','G6','G11','G14','G18'):
              rows=[]
              with (Path('data')/f'{g}.txt').open() as fh:
                  n,m=map(int,fh.readline().split())
                  assert n==800
                  for line in fh:
                      a,b,w=line.split()
                      rows.append((int(a)-1,int(b)-1,float(w)))
              assert len(rows)==m
              bygraph[g]=(np.array([a for a,b,w in rows]),np.array([b for a,b,w in rows]),
                          np.array([w for a,b,w in rows]))
          def sha(path):
              dig=hashlib.sha256()
              with path.open('rb') as f:
                  for part in iter(lambda:f.read(1<<20),b''):dig.update(part)
              return dig.hexdigest()
          total=0
          for case in sorted((root/'runs').glob('*/**/case.json')):
              d=json.loads(case.read_text()); row=d['row']
              graph,seed,mode=d['graph'],int(d['seed']),d['rank_mode']
              assert graph in bygraph and 2031<=seed<=2125 and mode in ('default','full')
              fa,pa=case.parent/'factor.npz',case.parent/'partitions.npz'
              assert sha(fa)==row['factor_sha256']
              assert sha(pa)==d['partitions_archive_sha256']
              with np.load(pa,allow_pickle=False) as archived:
                  assert set(archived.files)=={'K-MeansNM_EVA'}
                  packed=archived['K-MeansNM_EVA']
              assert hashlib.sha256(packed.tobytes()).hexdigest()==row['partition_sha256']
              bits=np.unpackbits(packed)[:800]
              a,b,w=bygraph[graph]
              score=float(w[bits[a]!=bits[b]].sum())
              assert abs(score-float(row['cut_weight']))<1e-9,(case,score,row['cut_weight'])
              assert row['graph']==graph and int(row['seed'])==seed and row['rank_mode']==mode
              total+=1
          assert total==950,total
          with (root/'all_runs.csv').open(newline='') as f:
              allrows=list(csv.DictReader(f))
          assert len(allrows)==1000
          assert len({(r['graph'],r['seed'],r['rank_mode']) for r in allrows})==1000
          with (root/'paired_differences.csv').open(newline='') as f:
              paired=list(csv.DictReader(f))
          assert len(paired)==500
          print(f'PASS: {total} verified new factor and signed-cut archives, plus 50 reused historical cases')
          PY
      - name: Normalize only text files before Git publication
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for file in Path('results/gset/experiment029-eva-kmeansnm-100seed').rglob('*'):
              if file.is_file() and file.suffix in ('.csv','.json','.jsonl','.md'):
                  data=file.read_bytes();lf=data.replace(b'\r\n',b'\n')
                  if data!=lf:file.write_bytes(lf)
          PY
      - name: Commit verified checkpoints and sweep histories to Git LFS per graph
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          for g in G1 G6 G11 G14 G18; do
            dir="results/gset/experiment029-eva-kmeansnm-100seed/runs/$g"
            git add -- "$dir"
            git diff --cached --check
            tracked="$(git ls-files -- "$dir" | grep -cE '\.npz$' || true)"
            test "$tracked" -eq 380 || { echo "Expected 380 $g binary FILE PATHS, got $tracked"; exit 1; }
            while IFS= read -r file; do
              attr="$(git check-attr filter -- "$file")"
              [[ "$attr" == *": filter: lfs" ]] || { echo "NOT tracked by Git LFS: $file"; exit 1; }
            done < <(git ls-files -- "$dir" | grep -E '\.npz$')
            unique="$(git lfs ls-files | grep -c "experiment029-eva-kmeansnm-100seed/runs/$g" || true)"
            echo "$g: $tracked paths, $unique unique LFS objects; exact duplicate partitions are expected."
            git commit -m "experiment029: archive $g 95 EVA factors, partitions and sweep traces"
            git push origin HEAD:experiment029-eva-kmeansnm-100seed
            echo "Archived all $g EVA artifacts with verified Git LFS storage"
          done
          echo 'PASS: all 1900 Git LFS binary archives published; no existing source modified'