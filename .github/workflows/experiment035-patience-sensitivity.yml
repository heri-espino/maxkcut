name: Experiment035 - patience sensitivity and convergence diagnostics
# Recover E034 from verified artifacts, then extend without repeating archived proposals.
on:
  push:
    branches: [experiment035-patience-sensitivity]
    paths: ['.github/workflows/experiment035-patience-sensitivity.yml']
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional earlier Experiment035 run ID containing graph checkpoints'
        required: false
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: experiment035-patience-sensitivity
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment035-patience-sensitivity'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.61,<0.69' threadpoolctl pytest
      - run: python scripts/experiment035_patience_sensitivity.py --action test

  recover:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      recovered_sha: ${{ steps.commit.outputs.sha }}
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment035-patience-sensitivity
          lfs: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.61,<0.69' threadpoolctl matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: experiment034-trajectories
          path: results/gset/experiment034-adaptive-hyperplane-sweep
          run-id: '45815246196'
          github-token: ${{ github.token }}
      - run: python scripts/experiment034_adaptive_hyperplane_sweep.py --action report
      - name: Commit recovered independently verified E034 archive
        id: commit
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          python - <<'PY'
          from pathlib import Path
          for p in Path('results/gset/experiment034-adaptive-hyperplane-sweep').rglob('*'):
              if p.is_file() and p.suffix in {'.json','.csv','.md'}:
                  data=p.read_bytes()
                  clean=data.replace(b'\r\n',b'\n')
                  if data != clean: p.write_bytes(clean)
          PY
          git add -f -- results/gset/experiment034-adaptive-hyperplane-sweep/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'experiment034: recover verified archive from run 45815246196'
            git push origin HEAD:experiment035-patience-sensitivity
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  compute:
    needs: recover
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 300
    steps:
      - name: Verify runner identity and isolated checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-13') { throw 'Wrong runner' }
          if ($env:GITHUB_WORKSPACE -eq 'C:\Users\175199\maxkcut') { throw 'Refusing active research worktree' }
          $active=Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'python.exe' -and $_.CommandLine -match 'experiment025|experiment026|experiment027|experiment028|experiment029|experiment030|experiment031|experiment032|experiment033|experiment034|experiment035' }
          if ($active) { throw 'Another numerical study appears active; do not compete for this VM' }
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ needs.recover.outputs.recovered_sha }}
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        with:
          name: experiment035-trajectories
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: results/gset/experiment035-patience-sensitivity/
      - name: Find existing maxkcut Conda environment without modifying packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prefix=$null
          if ($env:MAXKCUT_CONDA_PREFIX -and (Split-Path $env:MAXKCUT_CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:MAXKCUT_CONDA_PREFIX }
          if (-not $prefix -and $env:CONDA_PREFIX -and (Split-Path $env:CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:CONDA_PREFIX }
          if (-not $prefix -and (Get-Command conda -ErrorAction SilentlyContinue)) {
            $json=(& conda env list --json | Out-String | ConvertFrom-Json)
            foreach ($e in @($json.envs)) {
              if ((Split-Path $e -Leaf) -ieq 'maxkcut' -and (Test-Path (Join-Path $e 'python.exe'))) { $prefix=$e; break }
            }
          }
          if (-not $prefix) {
            foreach ($candidate in @("$env:LOCALAPPDATA\miniconda3\envs\maxkcut", "$env:USERPROFILE\miniconda3\envs\maxkcut", 'C:\ProgramData\miniconda3\envs\maxkcut')) {
              if (Test-Path (Join-Path $candidate 'python.exe')) { $prefix=$candidate; break }
            }
          }
          if (-not $prefix -or -not (Test-Path (Join-Path $prefix 'python.exe'))) { throw 'Existing maxkcut Conda environment unavailable' }
          Add-Content $env:GITHUB_ENV "EX035_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "EX035_PYTHON=$(Join-Path $prefix 'python.exe')"
      - name: Pilot and complete matched raw comparison
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH=(Join-Path (Get-Location).Path 'src')+';'+(Join-Path (Get-Location).Path 'scripts')
          $env:CONDA_PREFIX=$env:EX035_PREFIX
          $env:CONDA_DEFAULT_ENV='maxkcut'
          foreach ($part in @('Library\mingw-w64\bin','Library\usr\bin','Library\bin','Scripts','')) {
            $p=Join-Path $env:EX035_PREFIX $part
            if (Test-Path $p) { $env:PATH="$p;$env:PATH" }
          }
          $env:NUMBA_NUM_THREADS='1'
          $env:OPENBLAS_NUM_THREADS='1'
          $env:MKL_NUM_THREADS='1'
          $env:OMP_NUM_THREADS='1'
          & $env:EX035_PYTHON -u scripts/experiment035_patience_sensitivity.py --action test
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic test failed' }
          & $env:EX035_PYTHON -u scripts/experiment035_patience_sensitivity.py --phase pilot --workers 1
          if ($LASTEXITCODE -ne 0) { throw 'Pilot failed' }
          & $env:EX035_PYTHON -u scripts/experiment035_patience_sensitivity.py --phase full --workers 8
          if ($LASTEXITCODE -ne 0) { throw 'Full benchmark failed' }
      - name: Upload recoverable graph checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment035-trajectories
          overwrite: true
          path: results/gset/experiment035-patience-sensitivity/
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [recover, compute]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          ref: ${{ needs.recover.outputs.recovered_sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.61,<0.69' threadpoolctl matplotlib
      - uses: actions/download-artifact@v4
        with:
          name: experiment035-trajectories
          path: results/gset/experiment035-patience-sensitivity/
      - name: Verify all records and generate figures and numerical appendix
        run: python scripts/experiment035_patience_sensitivity.py --action report
      - uses: actions/upload-artifact@v4
        with:
          name: experiment035-report
          overwrite: true
          path: |
            results/gset/experiment035-patience-sensitivity/full/*.pdf
            results/gset/experiment035-patience-sensitivity/full/*.csv
            results/gset/experiment035-patience-sensitivity/full/*.json
            results/gset/experiment035-patience-sensitivity/full/report.md
          if-no-files-found: error
          retention-days: 90
      - name: Commit verified numerical archives and report
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          python - <<'PY'
          from pathlib import Path
          for p in Path('results/gset/experiment035-patience-sensitivity').rglob('*'):
              if p.is_file() and p.suffix in {'.json','.csv','.md'}:
                  data=p.read_bytes()
                  clean=data.replace(b'\r\n',b'\n')
                  if data != clean: p.write_bytes(clean)
          PY
          git add -f -- results/gset/experiment035-patience-sensitivity/
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already committed'; else
            git commit -m 'experiment035: archive audited patience sensitivity and diagnostics'
            git push origin HEAD:experiment035-patience-sensitivity
          fi
