name: Optional visualization smoke tests

on:
  pull_request:
    paths:
      - "src/maxkcut_viz/**"
      - "tests/test_geometry_viz.py"
      - "tests/test_geometry_dashboard.py"
      - "pyproject.toml"
      - "scripts/launch_geometry_dashboard.ps1"
      - ".github/workflows/visualization-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install optional viz dependencies
        run: python -m pip install -e ".[viz,test]"
      - name: Verify source fingerprint isolation and syntax
        run: |
          python -m compileall -q src/maxkcut_viz
          python - <<'PY'
          from pathlib import Path
          import ast
          code = Path("src/maxkcut/experiment025_bestcut.py").read_text()
          assert 'src.glob("*.py")' in code, "Re-audit optimizer fingerprint scope before merging viz"
          py = Path("src/maxkcut_viz")
          assert py.is_dir() and not (Path("src/maxkcut") / "geometry_viz.py").exists()
          for name in ("geometry_viz.py", "geometry_dashboard.py"):
              ast.parse((py / name).read_text())
          print("PASS: optional viz outside frozen numerical source")
          PY
      - name: Run real archive reader and Streamlit tests
        run: python -m pytest tests/test_geometry_viz.py tests/test_geometry_dashboard.py -q
      - name: Import optional viz
        run: python -c "import maxkcut_viz.geometry_viz, maxkcut_viz.geometry_dashboard; print('viz imports succeed')"
