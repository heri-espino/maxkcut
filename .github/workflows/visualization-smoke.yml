name: Visualization-only smoke tests

on:
  pull_request:
    paths:
      - "src/maxkcut/geometry_*.py"
      - "tests/test_geometry_viz.py"
      - "pyproject.toml"
      - ".github/workflows/visualization-smoke.yml"
  workflow_dispatch:

jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install visualization-only dependencies
        run: python -m pip install -e ".[visualization,test]"
      - name: Compile visualization modules
        run: python -m compileall -q src/maxkcut/geometry_viz.py src/maxkcut/geometry_dashboard.py
      - name: Test cached artifact readers and projections
        run: python -m pytest tests/test_geometry_viz.py -q
      - name: Import Streamlit dashboard
        run: python -c "import maxkcut.geometry_dashboard; print('dashboard import successful')"
