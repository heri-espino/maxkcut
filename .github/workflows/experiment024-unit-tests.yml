name: "Experiment024 - paired GW16 reproducibility tests"
on:
  push:
    branches: [experiment024-paired-gw16]
    paths:
      - ".github/workflows/experiment024-unit-tests.yml"
      - "src/maxkcut/experiment024_*.py"
      - "tests/test_experiment024_*.py"
      - "src/maxkcut/eva_cutaware_kmeans.py"
      - "src/maxkcut/eva_multigroup_kmeans.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and numerical test dependencies
        run: python -m pip install -e ".[test,eva-fast]"
      - name: Compile and test shared 16-GW initialization contract
        run: |
          python -m compileall -q src/maxkcut/experiment024_paired_gw16.py src/maxkcut/experiment024_analysis.py tests/test_experiment024_paired_gw16.py
          python -m pytest tests/test_experiment024_paired_gw16.py tests/test_experiment024_integration.py -q
