name: Experiment036 - LaTeX appendix and source publication
on:
  push:
    branches: [experiment036-inertia-guided-sweep]
    paths: ['.github/workflows/experiment036-latex-appendix.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: experiment036-inertia-guided-sweep
  cancel-in-progress: false
jobs:
  report:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment036-inertia-guided-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment036-inertia-guided-sweep
          fetch-depth: 0
          lfs: false
      - uses: actions/download-artifact@v4
        with:
          name: experiment036-report-recovery
          run-id: '45885883213'
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/e036-audited-report
      - name: Prepare self-contained LaTeX source from the audited report
        run: |
          set -euo pipefail
          export PROJECT="$RUNNER_TEMP/e036-latex"
          mkdir -p "$PROJECT/figures" "$PROJECT/data"
          cp results/gset/experiment036-inertia-guided-sweep/full/latex/{main.tex,generate_results.py,README.md,maxcut-appendix.sty} "$PROJECT/"
          python - <<'PY'
          import os,hashlib,json,shutil
          from pathlib import Path
          p=Path(os.environ["PROJECT"]); src=Path(os.environ["RUNNER_TEMP"])/"e036-audited-report"
          original=next(src.rglob("Experiment036_Numerical_Appendix.pdf")).parent
          figures=sorted(x for x in original.glob("*.pdf") if x.name!="Experiment036_Numerical_Appendix.pdf")
          assert len(figures)==17
          for f in figures: shutil.copy2(f,p/"figures"/f.name)
          for name in ["summary.json","method_summary.csv","per_graph.csv","per_seed.csv"]: shutil.copy2(original/name,p/"data"/name)
          s=json.loads((p/"data/summary.json").read_text()); assert s["audited_records"]==716826 and s["complete"]
          files=[x for d in ("data","figures") for x in sorted((p/d).glob("*")) if x.is_file()]
          data={"source_run":45885883213,"artifact_id":15149891652,"computation_commit":"007ebcc326797e60edb791f1ed34a53f85a20505","files":[{"path":str(x.relative_to(p)),"bytes":x.stat().st_size,"sha256":hashlib.sha256(x.read_bytes()).hexdigest()} for x in files]}
          (p/"provenance.json").write_text(json.dumps(data,indent=2)+"\n")
          PY
          cd "$PROJECT"
          python generate_results.py
      - name: Install LaTeX and STIX2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends latexmk texlive-latex-extra texlive-science texlive-fonts-extra poppler-utils
          kpsewhich stix2.sty
      - name: Compile and verify actual appendix
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/e036-latex"
          latexmk -pdf -interaction=nonstopmode -halt-on-error main.tex
          if grep -E 'Overfull \\[hv]box|undefined references|There were undefined' main.log; then exit 1; fi
          pdffonts main.pdf > "$RUNNER_TEMP/e036-fonts.txt"
          grep -i 'STIXTwoText' "$RUNNER_TEMP/e036-fonts.txt"
          grep -i 'STIXTwoMath' "$RUNNER_TEMP/e036-fonts.txt"
          pdfinfo main.pdf | grep -E '^Pages: +14$'
          pdftotext main.pdf "$RUNNER_TEMP/e036-text.txt"
          grep -F '716,826' "$RUNNER_TEMP/e036-text.txt"
          mkdir -p "$RUNNER_TEMP/e036-preview"
          pdftoppm -r 80 -png main.pdf "$RUNNER_TEMP/e036-preview/page"
          cp main.pdf "$RUNNER_TEMP/Experiment036_Numerical_Appendix.pdf"
          latexmk -c
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path("provenance.json")
          j=json.loads(p.read_text())
          j["compiled_pdf"]={"bytes":Path("main.pdf").stat().st_size,"sha256":hashlib.sha256(Path("main.pdf").read_bytes()).hexdigest(),"pages":14}
          p.write_text(json.dumps(j,indent=2)+"\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: experiment036-latex-project
          path: |
            ${{ runner.temp }}/Experiment036_Numerical_Appendix.pdf
            ${{ runner.temp }}/e036-latex/
            ${{ runner.temp }}/e036-preview/
          if-no-files-found: error
          retention-days: 90
      - name: Publish PDF and editable LaTeX source only (no raw trajectories)
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          branch=experiment036-inertia-guided-sweep
          root=results/gset/experiment036-inertia-guided-sweep/full
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git switch --detach FETCH_HEAD
            mkdir -p "$root/latex"
            cp "$RUNNER_TEMP/Experiment036_Numerical_Appendix.pdf" "$root/"
            cp -a "$RUNNER_TEMP/e036-latex/." "$root/latex/"
            rm -f "$root/latex/main.pdf"
            git add -f -- "$root/Experiment036_Numerical_Appendix.pdf" "$root/latex/"
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'experiment036: typeset STIX2 appendix and preserve complete LaTeX source'
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 2
          done
          exit 1
