name: "One-time audited merged branch cleanup"

on:
  pull_request:
    paths:
      - "notes/maintenance/branch-cleanup-inventory.json"
      - "scripts/maintenance/prune_merged_branches.py"
      - ".github/workflows/merged-branch-prune.yml"
  push:
    branches: [main]
    paths:
      - "notes/maintenance/branch-cleanup-inventory.json"
  workflow_dispatch:
    inputs:
      delete_merged:
        description: "Delete only exact-SHA-verified merged branches"
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: merged-branch-prune
  cancel-in-progress: false

jobs:
  prune:
    # A merge containing the approved inventory triggers this once on main.
    # PRs and ordinary manual dispatches only audit, never delete.
    if: github.repository == 'heri-espino/maxkcut'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test SHA-pinned cleanup and protected-branch safeguards
        run: |
          python -m pip install "pytest>=8"
          python -m pytest tests/test_prune_merged_branches.py -q
      - name: Inspect SHA-pinned merged branches (read-only)
        run: |
          python scripts/maintenance/prune_merged_branches.py \
            --audit-output branch-cleanup-dry-run.json
      - name: Delete authorized merged branches after merge to main
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.delete_merged)
        run: |
          python scripts/maintenance/prune_merged_branches.py --execute \
            --audit-output branch-cleanup-execution.json
      - name: Preserve cleanup reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: merged-branch-cleanup-audit
          path: branch-cleanup-*.json
          if-no-files-found: warn
