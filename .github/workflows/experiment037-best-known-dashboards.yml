name: Experiment037 - dashboard-only recovery
on:
  push:
    branches: [experiment037-best-known-dashboards]
    paths: ['.github/workflows/experiment037-best-known-dashboards.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: maxkcut-experiment037
  cancel-in-progress: false
jobs:
  dashboards:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment037-best-known-dashboards'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: experiment037-compact
          run-id: 46065620135
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/e037-data
      - name: Install dashboard dependencies only
        run: |
          python -m pip install 'numpy>=1.26,<3' 'matplotlib==3.10.8' 'pymupdf==1.26.5' 'awesomefigures @ git+https://github.com/heri-espino/awesomefigures.git@d673decd59132094d0763c9e22d4fd6098ff6def'
      # Fixed-page layout and real-data preflight (recovery of run 46069574170).
      - name: Render and verify the 96 dashboard pages directly
        run: |
          python scripts/experiment037_report.py --data "$RUNNER_TEMP/e037-data" --output "$RUNNER_TEMP/e037-dashboard" --workers 16
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: experiment037-dashboard-diagnostics
          path: ${{ runner.temp }}/e037-dashboard/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: experiment037-dashboards
          path: ${{ runner.temp }}/e037-dashboard/
          if-no-files-found: error
          retention-days: 90
      - name: Publish dashboards and reproducible compact data
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          branch=experiment037-best-known-dashboards
          root=results/gset/experiment037-best-known-dashboards/full
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git switch --detach FETCH_HEAD
            mkdir -p "$root"
            cp -a "$RUNNER_TEMP/e037-dashboard/Experiment037_Dashboard_Appendix.pdf" "$RUNNER_TEMP/e037-dashboard/dashboard_index.json" "$RUNNER_TEMP/e037-dashboard/figures" "$RUNNER_TEMP/e037-dashboard/data" "$root/"
            cp "$root/data/storage_manifest.json" "$root/"
            git add -f -- "$root/Experiment037_Dashboard_Appendix.pdf" "$root/dashboard_index.json" "$root/figures" "$root/data" "$root/storage_manifest.json"
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'experiment037: archive 96 dashboard pages and compact source data'
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 2
          done
          exit 1
