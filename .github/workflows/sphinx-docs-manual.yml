name: Build Sphinx documentation (manual)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: maxkcut
          environment-file: environment.yml
          auto-update-conda: false
      - name: Confirm package imports
        run: python -c 'import maxkcut; print(maxkcut.__version__)'
      - name: Build HTML docs with warnings treated as errors
        run: sphinx-build -b html docs docs/_build/html -W --keep-going
      - name: Upload HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: maxkcut-sphinx-html
          path: docs/_build/html/
