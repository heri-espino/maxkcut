name: Experiment038 - adaptive patience 300
on:
  push:
    branches: [experiment038-patience300]
    paths: ['.github/workflows/experiment038-patience300.yml']
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: maxkcut-experiment038
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment038-patience300'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.61,<0.69' threadpoolctl
      - run: python scripts/experiment038_patience300.py --action test
  compute:
    needs: validate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 330
    steps:
      - name: Confirm designated idle VM
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-13') { throw 'Wrong runner' }
          if ($env:GITHUB_WORKSPACE -eq 'C:\Users\175199\maxkcut') { throw 'Refusing active research checkout' }
          $active=Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'python.exe' -and $_.CommandLine -match 'maxkcut|experiment0[23][0-9]' }
          if ($active) { throw 'Another research process appears active; do not compete with the VM' }
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
      - name: Locate existing Conda without changing VM packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prefix=$null
          if ($env:MAXKCUT_CONDA_PREFIX -and (Split-Path $env:MAXKCUT_CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:MAXKCUT_CONDA_PREFIX }
          if (-not $prefix -and $env:CONDA_PREFIX -and (Split-Path $env:CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:CONDA_PREFIX }
          if (-not $prefix -and (Get-Command conda -ErrorAction SilentlyContinue)) {
            $json=(& conda env list --json | Out-String | ConvertFrom-Json)
            foreach ($e in @($json.envs)) { if ((Split-Path $e -Leaf) -ieq 'maxkcut' -and (Test-Path (Join-Path $e 'python.exe'))) { $prefix=$e; break } }
          }
          if (-not $prefix) {
            foreach ($candidate in @("$env:LOCALAPPDATA\miniconda3\envs\maxkcut","$env:USERPROFILE\miniconda3\envs\maxkcut",'C:\ProgramData\miniconda3\envs\maxkcut')) {
              if (Test-Path (Join-Path $candidate 'python.exe')) { $prefix=$candidate; break }
            }
          }
          if (-not $prefix -or -not (Test-Path (Join-Path $prefix 'python.exe'))) { throw 'Existing maxkcut Conda environment unavailable' }
          Add-Content $env:GITHUB_ENV "EX038_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "EX038_PYTHON=$(Join-Path $prefix 'python.exe')"
      - name: Compute and audit 71 graphs using 16 workers; archive directly to durable VM path
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH=(Join-Path (Get-Location).Path 'src')+';'+(Join-Path (Get-Location).Path 'scripts')
          $env:CONDA_PREFIX=$env:EX038_PREFIX
          $env:CONDA_DEFAULT_ENV='maxkcut'
          foreach ($part in @('Library\mingw-w64\bin','Library\usr\bin','Library\bin','Scripts','')) {
            $p=Join-Path $env:EX038_PREFIX $part
            if (Test-Path $p) { $env:PATH="$p;$env:PATH" }
          }
          $env:NUMBA_NUM_THREADS='1'; $env:OPENBLAS_NUM_THREADS='1'; $env:MKL_NUM_THREADS='1'; $env:OMP_NUM_THREADS='1'
          $archive=Join-Path $env:USERPROFILE "maxkcut-archives\experiment038\run-$env:GITHUB_RUN_ID"
          $source=Join-Path $env:USERPROFILE 'maxkcut-archives\experiment037\run-46065620135'
          if (-not (Test-Path $source)) { throw 'Original E037 VM archive missing; do not recompute' }
          $compact=Join-Path $archive 'compact'
          New-Item -ItemType Directory -Force -Path $archive | Out-Null
          Add-Content $env:GITHUB_ENV "EX038_ARCHIVE=$archive"
          Write-Host "Durable VM archive: $archive"
          & $env:EX038_PYTHON -u scripts/experiment038_patience300.py --action test
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic tests failed' }
          & $env:EX038_PYTHON -u scripts/experiment038_patience300.py --workers 16 --source $source --archive $archive --output $compact
          if ($LASTEXITCODE -ne 0) { throw 'Experiment038 failed; verified checkpoints remain on VM' }
      - uses: actions/upload-artifact@v4
        with:
          name: experiment038-compact
          path: ${{ env.EX038_ARCHIVE }}/compact/
          if-no-files-found: error
          retention-days: 90
  report:
    needs: compute
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v4
        with:
          name: experiment038-compact
          path: ${{ runner.temp }}/e038-data
      - run: |
          python -m pip install 'numpy>=1.26,<3' 'matplotlib==3.10.8' 'pymupdf==1.26.5' 'awesomefigures @ git+https://github.com/heri-espino/awesomefigures.git@d673decd59132094d0763c9e22d4fd6098ff6def'
          python scripts/experiment038_report.py --data "$RUNNER_TEMP/e038-data" --output "$RUNNER_TEMP/e038-report"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: experiment038-report
          path: ${{ runner.temp }}/e038-report/
          if-no-files-found: ignore
          retention-days: 90
      - name: Publish verified report and compact results
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          branch=experiment038-patience300
          root=results/gset/experiment038-patience300/full
          for attempt in 1 2 3 4; do
            git fetch origin "$branch"
            git switch --detach FETCH_HEAD
            mkdir -p "$root/data"
            cp -a "$RUNNER_TEMP/e038-data/." "$root/data/"
            cp -a "$RUNNER_TEMP/e038-report/Experiment038_Dashboard_Appendix.pdf" "$RUNNER_TEMP/e038-report/figures" "$root/"
            git add -f -- "$root/"
            git diff --cached --check
            if git diff --cached --quiet; then exit 0; fi
            git commit -m 'experiment038: publish audited adaptive patience results and dashboards'
            if git push origin HEAD:"$branch"; then exit 0; fi
            sleep 2
          done
          exit 1
