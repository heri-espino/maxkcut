name: Experiment030 - local-field weighted K-MeansNM on archived EVA factors

# One-shot workflow. Only editing THIS workflow on this branch will dispatch a
# second numerical job; source and reporting commits never do so.
# Experiment030 is complete; any future execution must be explicitly dispatched.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment030-local-field-clustering
  cancel-in-progress: true

jobs:
  validate:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment030-local-field-clustering'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install hosted scientific-test dependencies only
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.67,<0.69' threadpoolctl pytest
      - name: Test fixed-point field geometry and traced K-MeansNM equivalence
        env:
          PYTHONPATH: src:scripts
          OPENBLAS_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: python -m pytest tests/test_experiment030_local_field_rounding.py -q
      - name: Verify five exact G-set graph hashes and all 1000 baseline CSV identities
        env:
          PYTHONPATH: src:scripts
        run: python scripts/experiment030_local_field_rounding.py --validate-only

  compute:
    needs: validate
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment030-local-field-clustering'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 240
    steps:
      - name: Refuse wrong runner or shared active Experiment025 worktree
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-13') { throw 'Wrong university runner' }
          if ($env:GITHUB_WORKSPACE -eq 'C:\Users\175199\maxkcut') { throw 'Refuse active research worktree' }
          Write-Host "Isolated checkout on $env:RUNNER_NAME / $env:GITHUB_WORKSPACE"
      - uses: actions/checkout@v4
        with:
          ref: experiment030-local-field-clustering
          lfs: true
          persist-credentials: false
          fetch-depth: 1
      - name: Confirm all historical EVA binary factors are resolved from Git LFS
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          foreach ($g in @('G1','G6','G11','G14','G18')) {
            foreach ($mode in @('default','full')) {
              foreach ($seed in @(2026,2030,2031,2078,2125)) {
                if ($seed -le 2030) { $base='results/gset/experiment028-eva-fullrank-pilot' }
                else { $base='results/gset/experiment029-eva-kmeansnm-100seed' }
                $file=Join-Path $base "runs/$g/$mode/seed-$seed/factor.npz"
                if (-not (Test-Path $file)) { throw "Missing LFS factor $file" }
                if ((Get-Item $file).Length -lt 1000) { throw "Unresolved Git LFS pointer $file" }
              }
            }
          }
          Write-Host 'All sampled Ex028/Ex029 factor arrays resolved.'
      - name: Find already-installed Conda maxkcut environment (no package changes)
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prefix=$null
          if ($env:MAXKCUT_CONDA_PREFIX -and (Split-Path $env:MAXKCUT_CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:MAXKCUT_CONDA_PREFIX }
          if (-not $prefix -and $env:CONDA_PREFIX -and (Split-Path $env:CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:CONDA_PREFIX }
          if (-not $prefix -and (Get-Command conda -ErrorAction SilentlyContinue)) {
            $json=(& conda env list --json | Out-String | ConvertFrom-Json)
            foreach ($e in @($json.envs)) {
              if ((Split-Path $e -Leaf) -ieq 'maxkcut' -and (Test-Path (Join-Path $e 'python.exe'))) { $prefix=$e; break }
            }
          }
          if (-not $prefix) {
            foreach ($candidate in @("$env:LOCALAPPDATA\miniconda3\envs\maxkcut", "$env:USERPROFILE\miniconda3\envs\maxkcut", 'C:\ProgramData\miniconda3\envs\maxkcut')) {
              if (Test-Path (Join-Path $candidate 'python.exe')) { $prefix=$candidate; break }
            }
          }
          if (-not $prefix -or -not (Test-Path (Join-Path $prefix 'python.exe'))) { throw 'Existing maxkcut Conda env unavailable' }
          Add-Content $env:GITHUB_ENV "EX030_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "EX030_PYTHON=$(Join-Path $prefix 'python.exe')"
      - name: Process 100 seeds per rank/graph using only archived factors
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH=(Join-Path (Get-Location).Path 'src')+';'+(Join-Path (Get-Location).Path 'scripts')
          $env:CONDA_PREFIX=$env:EX030_PREFIX
          $env:CONDA_DEFAULT_ENV='maxkcut'
          foreach ($part in @('Library\mingw-w64\bin','Library\usr\bin','Library\bin','Scripts','')) {
            $p=Join-Path $env:EX030_PREFIX $part
            if (Test-Path $p) { $env:PATH="$p;$env:PATH" }
          }
          $env:NUMBA_NUM_THREADS='1'
          $env:OPENBLAS_NUM_THREADS='1'
          $env:MKL_NUM_THREADS='1'
          $env:OMP_NUM_THREADS='1'
          & $env:EX030_PYTHON -u scripts/experiment030_local_field_rounding.py --workers 5
          if ($LASTEXITCODE -ne 0) { throw "Experiment030 clustering failed $LASTEXITCODE" }
          & $env:EX030_PYTHON -u scripts/experiment030_local_field_rounding.py --verify-only
          if ($LASTEXITCODE -ne 0) { throw 'Experiment030 independent partition coverage failed' }
      - name: Upload G1 original signed cut and full clustering trace archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment030-G1-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G1/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload G6 original signed cut and full clustering trace archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment030-G6-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G6/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload G11 original signed cut and full clustering trace archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment030-G11-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G11/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload G14 original signed cut and full clustering trace archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment030-G14-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G14/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload G18 original signed cut and full clustering trace archive
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment030-G18-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G18/
          if-no-files-found: warn
          retention-days: 90
      - name: Upload combined original signed cut statistics
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: experiment030-compact
          path: |
            results/gset/experiment030-local-field-clustering/all_rounds.csv
            results/gset/experiment030-local-field-clustering/paired_differences.csv
            results/gset/experiment030-local-field-clustering/per_graph_method.csv
            results/gset/experiment030-local-field-clustering/report.md
            results/gset/experiment030-local-field-clustering/summary.json
          if-no-files-found: error
          retention-days: 90

  publish:
    needs: compute
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment030-local-field-clustering'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment030-local-field-clustering
          fetch-depth: 0
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Hosted verification packages (no EVA solver)
        run: python -m pip install --disable-pip-version-check 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.67,<0.69' threadpoolctl
      - uses: actions/download-artifact@v4
        with:
          name: experiment030-compact
          path: results/gset/experiment030-local-field-clustering
      - uses: actions/download-artifact@v4
        with:
          name: experiment030-G1-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G1
      - uses: actions/download-artifact@v4
        with:
          name: experiment030-G6-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G6
      - uses: actions/download-artifact@v4
        with:
          name: experiment030-G11-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G11
      - uses: actions/download-artifact@v4
        with:
          name: experiment030-G14-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G14
      - uses: actions/download-artifact@v4
        with:
          name: experiment030-G18-cases
          path: results/gset/experiment030-local-field-clustering/graphs/G18
      - name: Normalize Windows text files only; preserve exact binary partitions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          for p in Path('results/gset/experiment030-local-field-clustering').rglob('*'):
              if p.is_file() and p.suffix in ('.json','.jsonl','.md','.csv'):
                  b=p.read_bytes(); fixed=b.replace(b'\r\n',b'\n')
                  if fixed!=b:p.write_bytes(fixed)
          PY
      - name: Independently audit all 6000 hard-cut scores on original signed edges
        shell: bash
        env:
          PYTHONPATH: src:scripts
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python scripts/experiment030_local_field_rounding.py --verify-only
          python - <<'PY'
          import csv,hashlib,json
          from pathlib import Path
          import numpy as np
          root=Path('results/gset/experiment030-local-field-clustering')
          s=json.loads((root/'summary.json').read_text())
          assert s['complete'] and s['new_eva_solves']==0 and s['input_factors_reused']==1000
          assert s['rounded_records']==6000 and s['factor_cases']==1000
          with (root/'all_rounds.csv').open(newline='') as f: allrows=list(csv.DictReader(f))
          with (root/'paired_differences.csv').open(newline='') as f: paired=list(csv.DictReader(f))
          assert len(allrows)==len(paired)==6000
          for graph in ('G1','G6','G11','G14','G18'):
              with (Path('data')/(graph+'.txt')).open() as fh:
                  n,m=map(int,fh.readline().split());ed=[line.split() for line in fh]
              assert n==800 and len(ed)==m
              ii=np.array([int(e[0])-1 for e in ed]);jj=np.array([int(e[1])-1 for e in ed]);w=np.array([float(e[2]) for e in ed])
              rootg=root/'graphs'/graph
              with (rootg/'cases.csv').open(newline='') as f: cases=list(csv.DictReader(f))
              assert len(cases)==1200
              with np.load(rootg/'partitions.npz',allow_pickle=False) as arc:
                  assert len(arc.files)==1200
                  for z in cases:
                      packed=arc[f"{z['rank_mode']}:{z['seed']}:{z['method']}"]
                      assert hashlib.sha256(packed.tobytes()).hexdigest()==z['partition_sha256']
                      labels=np.unpackbits(packed)[:n]
                      score=float(w[labels[ii]!=labels[jj]].sum())
                      assert abs(score-float(z['cut_weight']))<1e-9,(graph,z['seed'],z['method'])
          print('PASS: second independent 6000-cut signed objective audit')
          PY
      - name: Publish all compact source-derived data and original iteration journals
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/gset/experiment030-local-field-clustering/
          git diff --cached --check
          if git diff --cached --quiet; then
            echo 'All verified files already committed'
          else
            git commit -m 'experiment030: publish 6000 signed cuts, 1000 frozen factor references and clustering traces'
            git push origin HEAD:experiment030-local-field-clustering
          fi
          echo 'PASS: Experiment030 audit and repository publication complete'