name: "Experiment025 - best seen Max-Cut over all 16 full refinements"
on:
  push:
    branches: [experiment025-gw16-bestcut-quality]
    paths: [.github/workflows/experiment025-quality-first.yml]
  workflow_dispatch:

permissions:
  contents: write

# This campaign waits for the ongoing Experiment023/024 numerical runner
# instead of competing for a single self-hosted Windows machine.
concurrency:
  group: experiment023-complete-topology
  cancel-in-progress: false

jobs:
  pilot:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment025-gw16-bestcut-quality'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Validate best-ever progress journals and run 3 x 18 x 16 pilot
        run: powershell -ExecutionPolicy Bypass -File .\\scripts\\experiment025-windows.ps1 -Phase pilot

  full:
    needs: pilot
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment025-gw16-bestcut-quality'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        graph: [G1, G2, G3, G4, G5, G6, G7, G8, G9, G10, G11, G12, G13, G14, G15, G16, G17, G18, G19, G20, G21, G22, G23, G24, G25, G26, G27, G28, G29, G30, G31, G32, G33, G34, G35, G36, G37, G38, G39, G40, G41, G42, G43, G44, G45, G46, G47, G48, G49, G50, G51, G52, G53, G54, G55, G56, G57, G58, G59, G60, G61, G62, G63, G64, G65, G66, G67, G70, G72, G77, G81]
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: All 16 full refinements and every improving intermediate cut
        run: powershell -ExecutionPolicy Bypass -File .\\scripts\\experiment025-windows.ps1 -Phase full -Graph ${{ matrix.graph }}

  coverage:
    needs: [pilot, full]
    if: always() && needs.pilot.result == 'success' && github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment025-gw16-bestcut-quality'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment025-gw16-bestcut-quality
          fetch-depth: 0
      - name: Summarize all verified best-ever cuts or fail on missing results
        run: powershell -ExecutionPolicy Bypass -File .\\scripts\\experiment025-windows.ps1 -Phase coverage
