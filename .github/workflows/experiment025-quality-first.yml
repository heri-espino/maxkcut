name: "Experiment025 - safe manual graph-method checkpoint"

# Replaces old monolithic 18-method-per-graph / six-hour workflow.
# Explicit manual dispatch ONLY, from main. No automatic branch pushes.
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "Pilot (G1,G14,G11) or full graph"
        required: true
        type: choice
        options: [pilot, full]
        default: pilot
      graph:
        description: "Canonical graph ID (full phase only; e.g. G11)"
        required: true
        default: G11
        type: string
      method:
        description: "Exactly one of 18 method protocol IDs"
        required: true
        type: choice
        options:
          - gw-rr
          - control-paired
          - gw-threshold
          - cutaware-kmeans
          - hyperplane-sweep
          - multigroup-k4
          - multigroup-k8
          - em-hard
          - em-cem
          - em-gibbs
          - mst-l2-longest
          - mst-l2-balanced
          - mst-l2-diameter
          - mst-l2-bestcut
          - mst-l2-multicut
          - mst-l1-bestcut
          - mst-linf-bestcut
          - control-tabu
        default: gw-rr
      chunk_size:
        description: "New seed refinements to run in each checkpoint (1-16)"
        required: true
        default: "4"
        type: choice
        options: ["1", "2", "4", "8", "16"]

permissions:
  contents: write

concurrency:
  group: experiment023-complete-topology
  cancel-in-progress: false

jobs:
  single_method:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true
          lfs: true
      - name: Run one method with explicit 16 GW seeds and safe result branch
        env:
          EXPERIMENT_PHASE: ${{ inputs.phase }}
          EXPERIMENT_GRAPH: ${{ inputs.graph }}
          EXPERIMENT_METHOD: ${{ inputs.method }}
          EXPERIMENT_CHUNK: ${{ inputs.chunk_size }}
        run: |
          ./scripts/experiment025-vm.ps1 -Phase $env:EXPERIMENT_PHASE -Graph $env:EXPERIMENT_GRAPH -Method $env:EXPERIMENT_METHOD -ChunkSize ([int]$env:EXPERIMENT_CHUNK)
