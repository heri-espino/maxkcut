name: Experiment036 - inertia-guided hyperplane sweep
on:
  push:
    branches: [experiment036-inertia-guided-sweep]
    paths: ['.github/workflows/experiment036-inertia-guided-sweep.yml']
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: 'Optional earlier E036 run ID containing graph checkpoints'
        required: false
        type: string
permissions:
  contents: write
  actions: read
concurrency:
  group: experiment036-inertia-guided-sweep
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment036-inertia-guided-sweep'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.61,<0.69' threadpoolctl
      - run: python scripts/experiment036_inertia_guided.py --action test
  compute:
    needs: validate
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 300
    steps:
      - name: Verify runner identity and isolated checkout
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          if ($env:RUNNER_NAME -ne 'PCAG103A-13') { throw 'Wrong runner' }
          if ($env:GITHUB_WORKSPACE -eq 'C:\Users\175199\maxkcut') { throw 'Refusing active research worktree' }
          $active=Get-CimInstance Win32_Process | Where-Object { $_.Name -eq 'python.exe' -and $_.CommandLine -match 'experiment025|experiment026|experiment027|experiment028|experiment029|experiment030|experiment031|experiment032|experiment033|experiment034|experiment035|experiment036' }
          if ($active) { throw 'Another numerical study appears active; do not compete for this VM' }
      - uses: actions/checkout@v4
        with:
          lfs: false
          persist-credentials: false
          fetch-depth: 1
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.resume_run_id != ''
        with:
          name: experiment036-trajectories
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
          path: results/gset/experiment036-inertia-guided-sweep/
      - name: Find existing maxkcut Conda environment without modifying packages
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $prefix=$null
          if ($env:MAXKCUT_CONDA_PREFIX -and (Split-Path $env:MAXKCUT_CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:MAXKCUT_CONDA_PREFIX }
          if (-not $prefix -and $env:CONDA_PREFIX -and (Split-Path $env:CONDA_PREFIX -Leaf) -ieq 'maxkcut') { $prefix=$env:CONDA_PREFIX }
          if (-not $prefix -and (Get-Command conda -ErrorAction SilentlyContinue)) {
            $json=(& conda env list --json | Out-String | ConvertFrom-Json)
            foreach ($e in @($json.envs)) {
              if ((Split-Path $e -Leaf) -ieq 'maxkcut' -and (Test-Path (Join-Path $e 'python.exe'))) { $prefix=$e; break }
            }
          }
          if (-not $prefix) {
            foreach ($candidate in @("$env:LOCALAPPDATA\miniconda3\envs\maxkcut", "$env:USERPROFILE\miniconda3\envs\maxkcut", 'C:\ProgramData\miniconda3\envs\maxkcut')) {
              if (Test-Path (Join-Path $candidate 'python.exe')) { $prefix=$candidate; break }
            }
          }
          if (-not $prefix -or -not (Test-Path (Join-Path $prefix 'python.exe'))) { throw 'Existing maxkcut Conda environment unavailable' }
          Add-Content $env:GITHUB_ENV "EX036_PREFIX=$prefix"
          Add-Content $env:GITHUB_ENV "EX036_PYTHON=$(Join-Path $prefix 'python.exe')"
      - name: Pilot and complete matched raw comparison
        shell: powershell
        run: |
          $ErrorActionPreference='Stop'
          $env:PYTHONPATH=(Join-Path (Get-Location).Path 'src')+';'+(Join-Path (Get-Location).Path 'scripts')
          $env:CONDA_PREFIX=$env:EX036_PREFIX
          $env:CONDA_DEFAULT_ENV='maxkcut'
          foreach ($part in @('Library\mingw-w64\bin','Library\usr\bin','Library\bin','Scripts','')) {
            $p=Join-Path $env:EX036_PREFIX $part
            if (Test-Path $p) { $env:PATH="$p;$env:PATH" }
          }
          $env:NUMBA_NUM_THREADS='1'
          $env:OPENBLAS_NUM_THREADS='1'
          $env:MKL_NUM_THREADS='1'
          $env:OMP_NUM_THREADS='1'
          & $env:EX036_PYTHON -u scripts/experiment036_inertia_guided.py --action test
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic test failed' }
          & $env:EX036_PYTHON -u scripts/experiment036_inertia_guided.py --phase pilot --workers 1
          if ($LASTEXITCODE -ne 0) { throw 'Pilot failed' }
          & $env:EX036_PYTHON -u scripts/experiment036_inertia_guided.py --phase full --workers 8
          if ($LASTEXITCODE -ne 0) { throw 'Full benchmark failed' }
      - name: Upload recoverable graph checkpoints even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment036-trajectories
          overwrite: true
          path: results/gset/experiment036-inertia-guided-sweep/
          if-no-files-found: warn
          retention-days: 90

  publish:
    needs: [validate, compute]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONPATH: src:scripts
      OPENBLAS_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install 'numpy>=1.26,<3' 'scipy>=1.12,<2' 'numba>=0.61,<0.69' threadpoolctl matplotlib pandas pymupdf 'awesomefigures @ git+https://github.com/heri-espino/awesomefigures.git@d673decd59132094d0763c9e22d4fd6098ff6def'
      - uses: actions/download-artifact@v4
        with:
          name: experiment036-trajectories
          path: results/gset/experiment036-inertia-guided-sweep/
      - run: python scripts/experiment036_report.py
      - uses: actions/upload-artifact@v4
        with:
          name: experiment036-report
          path: |
            results/gset/experiment036-inertia-guided-sweep/full/*.pdf
            results/gset/experiment036-inertia-guided-sweep/full/*.csv
            results/gset/experiment036-inertia-guided-sweep/full/*.json
            results/gset/experiment036-inertia-guided-sweep/full/report.md
          if-no-files-found: error
          retention-days: 90
      - name: Publish audited results, figures and appendix
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git config core.autocrlf false
          git lfs install --local
          git add -f -- results/gset/experiment036-inertia-guided-sweep/
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'experiment036: publish audited geometry-guided sweep results'
            git push origin HEAD:experiment036-inertia-guided-sweep
          fi
