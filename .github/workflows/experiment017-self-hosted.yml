name: Experiment017 — self-hosted Windows multigroup pilot

# Only our dedicated experiment branch; avoid executing external PR code
# on the university Windows workstation.
on:
  push:
    branches:
      - experiment017-multigroup-kmeans-coarsening
    paths:
      - .github/workflows/experiment017-self-hosted.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: experiment017-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pilot:
    name: Exact k-group mergers — G63 (Windows)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 60
    defaults:
      run:
        shell: powershell
    env:
      PYTHONPATH: ${{ github.workspace }}\src
      PYTHONUTF8: '1'
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMBA_NUM_THREADS: '1'
    steps:
      - name: Checkout exact experiment017 source and saved EVA factor
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Select existing maxkcut Conda Python (no admin/install)
        id: select-python
        run: |
          $ErrorActionPreference = 'Stop'
          $candidates = @(
            "$env:USERPROFILE\miniconda3\envs\maxkcut\python.exe"
            "$env:USERPROFILE\miniforge3\envs\maxkcut\python.exe"
            "$env:USERPROFILE\anaconda3\envs\maxkcut\python.exe"
            "$env:LOCALAPPDATA\miniconda3\envs\maxkcut\python.exe"
            "$env:LOCALAPPDATA\Programs\miniconda3\envs\maxkcut\python.exe"
            "C:\ProgramData\miniconda3\envs\maxkcut\python.exe"
          )
          $python = $null
          foreach ($candidate in $candidates) {
            if (Test-Path -LiteralPath $candidate) { $python = $candidate; break }
          }
          if (-not $python) {
            $conda = Get-Command conda -ErrorAction SilentlyContinue
            if ($conda) {
              $envlist = & conda env list --json | ConvertFrom-Json
              foreach ($prefix in $envlist.envs) {
                if ((Split-Path $prefix -Leaf) -eq 'maxkcut') {
                  $candidate = Join-Path $prefix 'python.exe'
                  if (Test-Path $candidate) { $python = $candidate; break }
                }
              }
            }
          }
          if (-not $python) {
            $fallback = Get-Command python -ErrorAction SilentlyContinue
            if ($fallback) { $python = $fallback.Source }
          }
          if (-not $python) {
            throw "Python not found for this runner user. Install the maxkcut Conda env in the runner account or add its Python path to this workflow."
          }
          Write-Host "Using Python: $python"
          & $python -c "import sys,numpy,scipy,numba,pytest; print(sys.executable); print('Numba',numba.__version__)"
          if ($LASTEXITCODE -ne 0) {
            throw "The selected Python is missing numpy/scipy/numba/pytest. Activate or locate the existing maxkcut Conda environment."
          }
          "MAXKCUT_PYTHON=$python" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Check original G63 factor, case and graph are present
        run: |
          $ErrorActionPreference = 'Stop'
          $inputs = @(
            'data/G63.txt'
            'results/gset/experiment003-eva-numba/cases/G63.json'
            'results/gset/experiment003-eva-numba/factors/G63.npz'
          )
          foreach ($file in $inputs) {
            if (-not (Test-Path $file)) { throw "Missing required committed source: $file" }
            Write-Host "Found $file"
          }

      - name: Run multigroup signed Max-Cut regression tests
        run: |
          & $env:MAXKCUT_PYTHON -m pytest tests/test_eva_multigroup_kmeans.py -q
          if ($LASTEXITCODE -ne 0) { throw 'Experiment017 tests failed; pilot was not started.' }

      - name: G63 small pilot using original EVA — no retraining
        run: |
          & $env:MAXKCUT_PYTHON -m maxkcut.eva_multigroup_kmeans_cli `
            --graphs G63 `
            --ks 2 4 6 8 10 `
            --inits paired `
            --restarts 2 `
            --chunk-size 1 `
            --workers 2 `
            --max-iter 20 `
            --top-merges 2 `
            --kl-passes 15 `
            --target 27047
          if ($LASTEXITCODE -ne 0) { throw 'G63 multigroup pilot failed.' }

      - name: Show leaderboard and score summary
        run: |
          $folder = 'results/gset/experiment017-multigroup-coarsening'
          Get-Content "$folder/leaderboard.json"
          Import-Csv "$folder/summary.csv" | Sort-Object { [double]$_.post_KL_cut } -Descending | Select-Object -First 10 | Format-Table -AutoSize

      - name: Upload independently verified G63 pilot partitions and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: experiment017-G63-self-hosted-${{ github.run_id }}
          path: |
            results/gset/experiment017-multigroup-coarsening/
          if-no-files-found: warn
          retention-days: 30

      - name: Commit successful pilot results back to experiment017 branch
        if: success() && github.ref == 'refs/heads/experiment017-multigroup-kmeans-coarsening'
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- results/gset/experiment017-multigroup-coarsening
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) {
            Write-Host 'All pilot result files are already committed.'
            exit 0
          }
          git commit -m "experiment017: save verified G63 self-hosted pilot results"
          if ($LASTEXITCODE -ne 0) { throw 'Could not commit pilot results.' }
          git push origin "HEAD:experiment017-multigroup-kmeans-coarsening"
          if ($LASTEXITCODE -ne 0) { throw 'Could not push pilot results to GitHub.' }
