name: Experiment028 - publish archived completed pilot (no numerical work)

on:
  push:
    branches: [experiment028-eva-fullrank-5x5]
    paths: [".github/workflows/experiment028-archive-results.yml"]

permissions:
  contents: write
  actions: read

jobs:
  archive:
    if: github.repository == 'heri-espino/maxkcut' && github.ref == 'refs/heads/experiment028-eva-fullrank-5x5'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out only the dedicated experimental branch
        uses: actions/checkout@v4
        with:
          ref: experiment028-eva-fullrank-5x5
          fetch-depth: 0
          lfs: false

      - name: Download completed run 43807215661 without recomputing EVA
        uses: actions/download-artifact@v4
        with:
          name: experiment028-fullrank-all-checkpoints
          run-id: 43807215661
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: results/gset/experiment028-eva-fullrank-pilot

      - name: Normalize Windows text line endings, never modify numeric binary arrays
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json,csv
          from pathlib import Path
          root=Path("results/gset/experiment028-eva-fullrank-pilot")
          for file in root.rglob("*"):
              if file.is_file() and file.suffix in {".json",".jsonl",".csv",".md",".svg"}:
                  data=file.read_bytes()
                  normalized=data.replace(b"\r\n",b"\n")
                  if data!=normalized:
                      file.write_bytes(normalized)
          def sha(p):
              dig=hashlib.sha256()
              with p.open("rb") as fh:
                  while True:
                      b=fh.read(1<<20)
                      if not b: break
                      dig.update(b)
              return dig.hexdigest()
          s=json.loads((root/"summary.json").read_text())
          assert s["complete"] and s["observed_rows"]==150 and s["matched_comparisons"]==75,s
          factors=sorted(root.glob("runs/*/*/seed-*/factor.npz"))
          cases=sorted(root.glob("runs/*/*/seed-*/case.json"))
          partitions=sorted(root.glob("runs/*/*/seed-*/partitions.npz"))
          assert len(factors)==len(cases)==len(partitions)==50,(len(factors),len(cases),len(partitions))
          signatures=set()
          for casefile in cases:
              obj=json.loads(casefile.read_text())
              directory=casefile.parent
              assert sha(directory/"factor.npz")==obj["factor_sha256"],casefile
              assert sha(directory/"partitions.npz")==obj["partitions_sha256"],casefile
              signatures.add((obj["settings"]["graph"],obj["settings"]["seed"],obj["settings"]["rank_mode"]))
          assert len(signatures)==50
          with (root/"all_runs.csv").open(newline="") as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==150 and {int(x["p"]) for x in rows}=={41,800}
          print("AUDITED: 50 checkpoints, 50 partition archives, 150 cut records, SHA-256 complete.")
          PY
          git diff --check
          git status --short | tail -30

      - name: Persist 50 factors and complete iteration logs to Git LFS
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git lfs install --local
          candidate='results/gset/experiment028-eva-fullrank-pilot/runs/G1/default/seed-2026/factor.npz'
          test "$(git check-attr filter -- "$candidate")" = "$candidate: filter: lfs"
          git add -- results/gset/experiment028-eva-fullrank-pilot/runs \
                     results/gset/experiment028-eva-fullrank-pilot/paired_mean_deltas.svg
          count="$(git lfs ls-files | grep -c 'experiment028-eva-fullrank-pilot' || true)"
          test "$count" -ge 100 || { echo "Expected 100 Git LFS objects, got $count"; exit 1; }
          git diff --cached --check
          if git diff --cached --quiet; then
              echo 'All output files already committed'
          else
              git commit -m 'experiment028: preserve 50 EVA factors, 50 partitions and every sweep in Git LFS'
              git push origin HEAD:experiment028-eva-fullrank-5x5
          fi
          echo 'Verified Git LFS checkpoint archival is complete.'
